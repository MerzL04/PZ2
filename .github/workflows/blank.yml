# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "development", "release/**" ]
  pull_request:
    branches: [ "main", "development", "release/**" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run tests
        run: bash test.sh
  generate-docs:
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Documentation
        run: |
          mkdir -p docs
          echo "# Документация проекта" > docs/index.md
          echo "Эта документация сгенерирована автоматически." >> docs/index.md
          echo "" >> docs/index.md
          echo "- **Дата последнего обновления:** $(date)" >> docs/index.md
          echo "- **Ветка:** ${{ github.ref_name }}" >> docs/index.md
          echo "- **Автор коммита:** ${{ github.actor }}" >> docs/index.md

      - name: Commit and Push docs
        run: |
          git config --global user.name MerzL04
          git config --global user.email reqmer34@gmail.com
          git add docs/index.md
          git commit -m "docs: auto-generate documentation [skip ci]" || echo "No changes to commit"
          git push
